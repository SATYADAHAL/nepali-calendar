<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">

<defs>

<!-- Moon spherical lighting -->
<radialGradient id="moonLight" cx="32%" cy="28%" r="75%">
    <stop offset="0%" stop-color="#f3f0e5"/>
    <stop offset="35%" stop-color="#ddd8c9"/>
    <stop offset="70%" stop-color="#b9b2a2"/>
    <stop offset="100%" stop-color="#80796d"/>
</radialGradient>


<!-- Surface texture -->


<!-- Soft crater shadow -->
<radialGradient id="crater">
    <stop offset="0%" stop-color="#80786b"/>
    <stop offset="65%" stop-color="#9b9486"/>
    <stop offset="100%" stop-color="#c3bdae"/>
</radialGradient>


</defs>


<!-- Moon body -->
<circle cx="24" cy="24" r="23" fill="url(#moonLight)" stroke="#6f6a61" stroke-width="0.8"/>


<!-- maria -->
<path d=" M10 16 C13 12 20 12 23 15 C27 19 23 24 18 25 C13 25 9 22 10 16Z" fill="#8f887a" opacity=".38"/>


<path d=" M29 18 C35 17 39 21 39 26 C38 31 32 33 28 29 C25 25 25 20 29 18Z" fill="#817a6e" opacity=".35"/>


<path d=" M18 31 C22 28 28 30 30 34 C31 38 26 41 21 39 C17 37 15 34 18 31Z" fill="#8c8578" opacity=".3"/>


<!-- craters -->
<ellipse cx="14" cy="14" rx="3" ry="2.5" fill="url(#crater)" opacity=".65"/>

<ellipse cx="35" cy="13" rx="1.8" ry="1.4" fill="#8c8578" opacity=".55"/>


<ellipse cx="37" cy="29" rx="2.2" ry="1.7" fill="#80786d" opacity=".45"/>


<ellipse cx="16" cy="36" rx="1.6" ry="1.2" fill="#827a6e" opacity=".5"/>


<!-- micro craters -->
<g fill="#777064" opacity=".35">

<circle cx="8" cy="25" r="0.8"/>
<circle cx="21" cy="9" r="0.7"/>
<circle cx="31" cy="8" r="0.6"/>
<circle cx="43" cy="23" r="0.7"/>
<circle cx="27" cy="42" r="0.8"/>
<circle cx="10" cy="34" r="0.5"/>

</g>


<!-- global surface grain -->


<path d="M24,1 A23,23 0 0,0 24,47 A11.499999999999995,23 0 0,1 24,1 Z" fill="#000000" opacity="0.5"/></svg>
